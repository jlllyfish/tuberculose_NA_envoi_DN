
name: Envoi DN quotidien

on:
  schedule:
    - cron: '0 2 * * *'  # 2h UTC = 4h heure été France (CEST = UTC+2)
  workflow_dispatch:      # Déclenchement manuel possible

jobs:
  envoi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install requests python-dotenv

      - name: Lancer le script
        env:
          DN_API_URL: ${{ secrets.DN_API_URL }}
          DN_API_TOKEN: ${{ secrets.DN_API_TOKEN }}
          DN_INSTRUCTEUR_ID: ${{ secrets.DN_INSTRUCTEUR_ID }}
          DN_ANNOTATION_ID: ${{ secrets.DN_ANNOTATION_ID }}
          DN_ANNOTATION_ID_AUTRES: ${{ secrets.DN_ANNOTATION_ID_AUTRES }}
          GRIST_API_TOKEN: ${{ secrets.GRIST_API_TOKEN }}
          GRIST_BASE_URL: ${{ secrets.GRIST_BASE_URL }}
          GRIST_DOC_ID: ${{ secrets.GRIST_DOC_ID }}
          GRIST_TABLE_REPETABLE: ${{ secrets.GRIST_TABLE_REPETABLE }}
        run: python app.py
